<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peterson Ramos — Portfólio 2026</title>
  <meta name="description" content="Portfólio de Peterson Ramos — Senior Product Designer & Project Manager.">
  <meta name="author" content="Peterson Ramos">
  <link rel="canonical" href="https://petersonramos.com.br/">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0f0f0f;
      color: #f5f5f5;
      font-family: Georgia, "Times New Roman", serif;
    }
    .viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .fallback {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      background:
        radial-gradient(ellipse at top, rgba(255, 255, 255, 0.08), transparent 55%),
        linear-gradient(160deg, #1a1a1a 0%, #0b0b0b 100%);
    }
    .fallback h1 {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .fallback p {
      max-width: 28rem;
      line-height: 1.5;
      opacity: 0.8;
    }
    .fallback a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.85rem 1.4rem;
      color: #0f0f0f;
      background: #f5f5f5;
      text-decoration: none;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .fallback a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <iframe
    class="viewer"
    src="/portifolio/portifolio-peterson-2026.pdf"
    title="Portfólio Peterson Ramos 2026"
  ></iframe>

  <noscript>
    <div class="fallback">
      <h1>Peterson Ramos</h1>
      <p>Abra o portfólio 2026 em PDF.</p>
      <a href="/portifolio/portifolio-peterson-2026.pdf">Abrir portfólio</a>
    </div>
  </noscript>
</body>
</html>
